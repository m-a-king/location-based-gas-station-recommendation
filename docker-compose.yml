services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/lbs?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: lbs
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      OPINET_API_KEY: ${OPINET_API_KEY}
      ITS_API_KEY: ${ITS_API_KEY}
      KAKAO_API_KEY: ${KAKAO_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: lbs
      MYSQL_USER: lbs
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql-data:
