spring:
  application:
    name: location-based service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID:placeholder-client-id}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo
            user-name-attribute: sub
            jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json

app:
  jwt:
    # 운영에서는 반드시 JWT_SECRET 환경변수로 주입한다(아래 기본값은 로컬 개발 전용).
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-in-production-0123456789}
    expiration: ${JWT_EXPIRATION:P7D}

opinet:
  api-key: ${OPINET_API_KEY}
  user-id: ${OPINET_USER_ID}
  password: ${OPINET_PASSWORD}

kakao:
  api-key: ${KAKAO_API_KEY}
